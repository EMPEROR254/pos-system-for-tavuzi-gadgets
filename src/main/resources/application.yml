spring:
  application:
    name: 'pos-system-for-tavuzi-gadgets-backend'
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:app}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  jpa:
    # The schema only changes through Flyway migrations (db/migration).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: 8080
  # Smaller responses = faster screens on slow connections.
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
    # The refresh token is an httpOnly cookie. Set COOKIE_SECURE=true when the
    # app is served over HTTPS; on a plain-HTTP shop network it must stay false.
    cookie-secure: ${COOKIE_SECURE:false}
    # After this many wrong passwords the account is locked for lock-minutes.
    max-failed-logins: 5
    lock-minutes: 15
  # First start only: creates the owner account when there are no users yet.
  bootstrap-owner:
    username: ${OWNER_USERNAME:}
    password: ${OWNER_PASSWORD:}
    full-name: ${OWNER_FULL_NAME:Owner}
  # VAT: prices are VAT-inclusive; the standard rate applies to STANDARD products.
  tax:
    vat-rate-percent: ${VAT_RATE_PERCENT:16}
  # Printed on every receipt (spec: till/paybill numbers and the return policy).
  shop:
    name: ${SHOP_NAME:TAVUZI GADGETS}
    location: ${SHOP_LOCATION:Resma Plaza, Room G-13, next to Oginga Odinga St, Nakuru}
    phone: ${SHOP_PHONE:}
    kra-pin: ${SHOP_KRA_PIN:}
    till-number: ${SHOP_TILL_NUMBER:}
    paybill-number: ${SHOP_PAYBILL_NUMBER:}
    paybill-account: ${SHOP_PAYBILL_ACCOUNT:}
    return-policy: ${SHOP_RETURN_POLICY:No returns or exchanges without the owner's approval. Keep this receipt for warranty claims.}
    footer:
      - Thank you for shopping with us!
  # Optional network receipt printer (ESC/POS, raw port 9100). Empty = print from the browser.
  printer:
    host: ${PRINTER_HOST:}
    port: ${PRINTER_PORT:9100}
    width: ${PRINTER_WIDTH:48}

mpesa:
  environment: ${MPESA_ENVIRONMENT:sandbox}
  consumer-key: ${MPESA_CONSUMER_KEY:}
  consumer-secret: ${MPESA_CONSUMER_SECRET:}
  shortcode: ${MPESA_SHORTCODE:}
  passkey: ${MPESA_PASSKEY:}
  callback-url: ${MPESA_CALLBACK_URL:}
