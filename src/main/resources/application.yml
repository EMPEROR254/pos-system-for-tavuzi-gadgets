spring:
  application:
    name: 'pos-system-for-tavuzi-gadgets-backend'
server:
  port: 8080
  # Smaller responses = faster screens on slow connections.
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
management:
  endpoints:
    web:
      exposure:
        include: health
