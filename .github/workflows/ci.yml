# GitHub Actions: build and test on every push and pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Code style (google-java-format); fix locally with: mvn spotless:apply
      - run: mvn -B spotless:check
      # Testcontainers uses the Docker engine available on GitHub runners.
      - run: mvn -B verify
